# cargo-nextest settings for `just test` (justfile). nextest runs each test
# in a process of its own, so a static in one test (a lazy global, a
# subscriber) never leaks into another.

[profile.default]
# Run every test even after a failure, as `just test` always has: the gate
# reports all failures at once.
fail-fast = false
# A test still running after a minute is reported as SLOW, and one still
# running after five is killed and fails as TIMEOUT, so a hung test names
# itself instead of holding the gate until gate.sh's 75-minute limit. The
# slowest tests take about a minute on a loaded machine.
slow-timeout = { period = "60s", terminate-after = 5 }
# Print each failure's output again at the end of the run.
final-status-level = "fail"
# Every test gets one retry inside the run, so a transient failure costs one
# test's time instead of a whole re-run of the gate (about 4.5 minutes, plus
# an agent turn to read the failure). A passing test never retries, so a
# green run costs nothing extra; a test that fails both tries fails the gate.
# nextest reports a pass on the second try as FLAKY (`TRY 2 PASS` and the
# summary's flaky count). That is not a clean pass: an implementer reports
# every FLAKY line, and a flaky test without an open issue is investigated as
# a possible race the change introduced (tools/agentic/brief-common.md).
# A hung test now costs two slow-timeouts (up to 10 minutes) before it fails.
retries = 1

