[package]
name = "okf_mcp"
default-run = "okf-mcp"
version = "0.32.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Peter Grace <pete.grace@gmail.com>"]

[lib]
name = "okf_mcp"
path = "src/lib.rs"

[[bin]]
name = "okf-mcp"
path = "src/main.rs"

[[bin]]
name = "okf-maintenance"
path = "src/bin/okf-maintenance.rs"

[dependencies]
# The HTTP server: routes, the auth middleware, extractors.
axum = "0.8.9"
# Application-level errors in the command line (the library uses OkfError).
anyhow = "1.0.104"
# Background jobs (Task 6 sends mail through them). Default features: the
# retry, timeout and tracing layers.
apalis = "1.0.0"
# apalis' job storage in the server's own Postgres. Default features
# (`migrate`, `tokio-comp`) use sqlx 0.9 with `tls-rustls-ring-webpki`, the
# same TLS backend as ours, so no second sqlx or TLS stack is linked. Its
# query macros check a live database when DATABASE_URL is set at build time:
# the justfile exports SQLX_OFFLINE=true.
apalis-postgres = "1.0.0"
# Password hashing (Task 4). Argon2id at OWASP's parameters by default;
# `hash_password` draws its own salt through getrandom.
argon2 = "0.6.0"
# `#[async_trait]` makes the `Mailer` trait usable as `Arc<dyn Mailer>`
# (Decision 10): native `async fn` in traits is not dyn-compatible.
async-trait = "0.1.92"
# The `ses` mail provider (issue #427): the SDK's standard region and
# credential chains (environment, profile, web identity, and the container
# provider that EKS Pod Identity uses), so no access key is configured. No
# default features: they add SSO and `credential_process`, which a server
# does not use. `default-https-client` is hyper over rustls; reqwest already
# links the same rustls and crypto provider.
aws-config = { version = "1.13.2", default-features = false, features = ["rt-tokio", "default-https-client"] }
# SES v2's `SendEmail`. No default features: they add SigV4a, which SES
# does not need.
aws-sdk-sesv2 = { version = "1.147.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
# Credential kinds `secrets-manager` and `iam` of a catalog store (issue #967),
# on the same `aws-config` chain as SES. `aws-sdk-secretsmanager` reads the
# secret. RDS IAM tokens are a SigV4-presigned URL, signed with `aws-sigv4`
# (already in the tree through the SDKs) rather than the whole `aws-sdk-rds`
# crate, which is large and adds no more than this one signing call.
aws-sdk-secretsmanager = { version = "1.129.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sigv4 = { version = "1.6.5", default-features = false, features = ["sign-http", "http1"] }
# The credentials the signer is given, and the request it signs.
aws-credential-types = "1.3.1"
aws-smithy-runtime-api = "1.9.2"
http = "1.3.1"
# API keys are 32 random bytes in unpadded base64url (`keys::generate`).
base64 = "0.23.1"
# Sizes with units in the configuration ("64MiB").
bytesize = { version = "2.7.0", features = ["serde"] }
# Wall-clock timestamps for catalog stamps (UTC only; no local-time database needed).
# `serde`: an OAuth client record (its timestamps) is stored in Redis inside a
# pending authorization (M16 Task 8).
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
# The command line (`okf-mcp migrate | catalog | key | import | export`);
# `env` lets DATABASE_URL fill `--database-url`.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Gzip for catalog archives (.tar.gz import and export).
flate2 = "1.1.10"
# Decoding `?catalogs=` on the MCP URL.
form_urlencoded = "1.2.2"
# The OS random source for API keys.
getrandom = "0.4.3"
# Durations with units in the configuration ("10s", "2h").
humantime-serde = "1.1.1"
# Insertion-ordered maps, matching Python dict order for frontmatter mappings.
indexmap = "2.14.2"
# SMTP (Task 6) in pure Rust: rustls with ring (as sqlx uses) and the
# webpki root store; `hostname` sends the real host name in EHLO. No
# default features: they pull in native-tls (OpenSSL).
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "ring", "webpki-roots", "hostname"] }
# OIDC sign-in (Task 9). No default features: they bring reqwest 0.12;
# `src/oidc.rs` adapts our reqwest 0.13 client instead (Decision 12).
# `accept-string-booleans`: some providers send `"email_verified": "true"`.
openidconnect = { version = "4.1.0", default-features = false, features = ["accept-string-booleans"] }
# OpenTelemetry: spans and log events over OTLP/HTTP-protobuf (src/telemetry).
# Every opentelemetry* crate is pinned at the release opentelemetry-prometheus
# supports (Task 2): its reader must be the same SDK major as the provider,
# or it is not the trait SdkMeterProvider accepts. Default features off: no
# tonic (a second TLS stack), no blocking client. `reqwest-client` sends with
# the async reqwest 0.13 below, on ring. The batch processors and the periodic
# reader run on tokio (`rt-tokio` and the `experimental_*_with_async_runtime`
# features). `internal-logs`: export failures become `tracing` events with the
# exporting crate's name as target, which the OTLP layers turn off (they reach
# stderr only).
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace", "logs", "metrics", "internal-logs"] }
# Header extraction and injection for W3C trace context on http 1.x maps.
opentelemetry-http = { version = "0.33.1", default-features = false }
# `tracing` events as OTLP log records.
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "trace", "logs", "metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs", "metrics", "internal-logs", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_logs_batch_log_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
# Prometheus `/metrics` from the same SdkMeterProvider that pushes OTLP
# (spec Decision 1): this reader renders into a `prometheus::Registry`. It
# turns on opentelemetry_sdk's `experimental_metrics_custom_reader`, which is
# what lets it mount as a reader, and it is why every opentelemetry* crate is
# held at its release (0.33): a reader from another SDK major does not compile.
opentelemetry-prometheus = "0.33.1"
# The registry the reader renders into, and its text encoder. No protobuf.
prometheus = { version = "0.14.0", default-features = false }
# Markdown to HTML for the web console (src/render.rs), which escapes raw
# HTML and filters link schemes itself. No default features: they only add
# getopts for pulldown-cmark's own command-line tool.
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# Data parallelism for building snapshots and running analyses across documents.
rayon = "1.12.0"
regex = "1.13.1"
# The owner audit view's opaque cursors (`http::api::audit::cursor`):
# ChaCha20-Poly1305 from ring, already in the lock through rustls and sqlx.
ring = "0.17.14"
# Runner HTTP client and endpoint normalization, with explicit TLS support.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
# MCP: the server handler, `#[tool]` macros, and the streamable HTTP service.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
# JSON schemas of tool parameters and results (rmcp builds on schemars 1).
schemars = "1.2.3"
# `Serialize` derives for the analysis reports, whose JSON must match okf.py's.
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps JSON object keys in insertion order (Python dict
# order), so `Value::to_json` keeps frontmatter keys in source order.
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
# API keys are stored only as their SHA-256.
sha2 = "0.11.1"
# The bounded async caches behind `cache::Bounded` (M18): size-bounded, with
# a TTL and single-flight loads. `future` is the async API.
moka = { version = "0.12.15", features = ["future"] }
# Unified diffs of a changeset against the published text (`pending_changes`).
similar = "2.7.0"
# Constant-time comparison of a presented key's hash with a stored one.
subtle = "2.6.1"
# Atomic writes via unique temp files (DiskWorkspace); also throwaway dirs in tests.
tempfile = "3.27.0"
# Catalog archives: .tar.gz import and export (with flate2).
tar = "0.4.46"
# Optional shared state for multi-replica serve (src/shared, spec
# 2026-11-17-okf-multi-replica-design.md). Pinned exactly: 1.8.2 is the newest
# stable release (2.0 is a release candidate). Default features off; we use the
# tokio connection manager, Lua scripts and rustls TLS (`rediss://`).
redis = { version = "=1.8.2", default-features = false, features = ["tokio-comp", "connection-manager", "cluster-async", "script", "tokio-rustls-comp"] }
# `StreamExt::next` on the pub/sub message stream (already in the lock via redis).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Only to install ring as the process CryptoProvider before a `rediss://`
# connect: the lock builds rustls with both ring and aws-lc-rs, and rustls then
# refuses to guess (rustls 0.23 `crypto/mod.rs`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Postgres access with runtime-checked queries, and the schema migrations
# embedded at compile time (`migrate!` needs `macros`). `json`: the
# `changeset_entries.replay` jsonb column as `serde_json::Value`.
# `tls-rustls-ring-webpki`: TLS in pure Rust (the binary links no OpenSSL).
# The deployment turns it on with `PGSSLMODE=verify-full` and
# `PGSSLROOTCERT`, which sqlx reads beneath the URL (M7). With a TLS backend
# compiled in, sqlx's default `sslmode=prefer` also tries TLS, unverified, on
# every connection that sets no mode (local runs, the CLI, the tests).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros", "json", "tls-rustls-ring-webpki"] }
thiserror = "2.0.6"
# The async runtime sqlx runs on, and the CLI's entry point.
# `time`: `tokio::time::interval` for the poll loop (and `sleep` in tests);
# `net`: the server's TCP listener; `signal`: SIGINT and SIGTERM.
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs"] }
# `CancellationToken`: one signal that stops the poll loop, rmcp's sessions
# and the HTTP server together (rmcp's config takes this type).
tokio-util = "0.7.20"
# The configuration file.
toml = "1.1"
# HTTP middleware: request tracing and timeouts.
tower-http = { version = "0.6.11", features = ["trace", "timeout"] }
tracing = "0.1.41"
# `tracing` spans as OTLP spans. 0.34 is the release built on opentelemetry 0.33.
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter", "registry"] }
# Parsing and checking OAuth URLs: CIMD client ids and redirect URIs
# (`src/oauth/clients.rs`). Already in the tree through reqwest; pinned to
# the same version so there is one copy.
url = "2.5.8"
# `SecretString` holds the OTLP header values and the Sentry DSN until the exporters take them.
secrecy = "0.10.3"
# Passkeys (Task 8), pure RustCrypto. `conditional-ui` enables
# discoverable (username-less) sign-in. `danger-allow-state-serialisation`
# lets a ceremony's state be stored in Redis with `[redis]` (M16 Task 10),
# so a ceremony begun on one replica finishes on another. The state goes
# to Redis, server-side, and never to the client (the danger the feature's
# name warns of); without `[redis]` it stays typed in memory.
webauthn-rs = { version = "0.6.2", features = ["conditional-ui", "danger-allow-state-serialisation"] }
# The WebAuthn types webauthn-rs' prelude does not re-export
# (`ResidentKeyRequirement`, and `AllowCredentials` in the tests; Decision 13).
# Pinned exactly, as webauthn-rs pins it.
webauthn-rs-proto = "=0.6.2"

[dev-dependencies]
# `kill(pid, 0)`, the sweep's liveness probe (tests/support/pg.rs). Already in
# the tree through other crates.
libc = "0.2.191"
# Decodes the password of the test server's URL (tests/support/pg.rs).
percent-encoding = "2.3.2"
# The in-memory span, log and metric exporters the telemetry tests read back.
# Features unify, so the test build gets them.
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["testing", "trace", "logs", "metrics"] }
# The OTLP protobuf message types and their decoder, for the mock collector
# the privacy sentinel test runs (tests/support/otlp_collector.rs). The same
# versions and features the exporter already builds with (no tonic transport).
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics"] }
prost = { version = "0.14.4", default-features = false }
# Property-based tests (Hypothesis-backed); the library is imported as `hegel`.
hegeltest = "0.50.3"
# The end-to-end tests talk to the server as a real MCP client would.
rmcp = { version = "3.8.0", features = ["client", "transport-streamable-http-client-reqwest"] }
# Certificates generated at test time for the TLS database test (never
# checked in: a key in the repository would trip secret scanners).
rcgen = "0.14.10"
# Throwaway Postgres containers for the database tests (needs Docker). Only
# the modules crate: it re-exports the testcontainers version it supports.
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
# `test-util`: paused time (`start_paused`), so a test of the 120-second
# request timeout runs at once.
tokio = { version = "1.54", features = ["test-util"] }
# `io`: `ReaderStream`, a request body that arrives as slowly as a test
# writes it (the import route's upload deadline).
tokio-util = { version = "0.7.20", features = ["io"] }
# `ServiceExt::oneshot`, to call an axum router in tests without a socket.
tower = { version = "0.5.3", features = ["util"] }
# Browser end-to-end tests of the web console (tests/ui_e2e): a native Rust
# Chromium driver (no Node). Its API is blocking; call it from spawn_blocking.
rustwright = "0.3.0"
# A WebSocket client for the browser journeys' raw DevTools calls (Chromium's
# virtual authenticator, `tests/ui_e2e/harness.rs`), which rustwright does
# not expose. Already in the tree through rustwright; the same version.
tungstenite = "0.29.0"
# A software passkey for the passkey tests (Task 8); no system libraries.
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }

# argon2 is roughly a hundred times slower unoptimized, and the password
# tests hash dozens of times; optimize it (and its BLAKE2) in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The tracing policy lint (docs/contributing/policy-lints.md): every non-test
# function carries `#[tracing::instrument]`. Only the `hyp_tracing` library is
# loaded.
[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/hypotheosis/hyp-rust-policy-lints", tag = "v0.1.2", pattern = "lints/hyp_tracing" },
]

# `cfg_attr(dylint_lib = "hyp_tracing", allow(...))` exemptions name a cfg
# only dylint sets; this keeps ordinary builds from warning about it.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

# A single-package workspace: dylint reads only `[workspace.metadata.dylint]`,
# not `[package.metadata.dylint]`. `exclude` keeps the `.worktrees/` checkouts
# (git worktrees nested in this directory) out of it: without it, a worktree
# whose Cargo.toml has no `[workspace]` fails with "current package believes
# it's in a workspace when it's not".
[workspace]
exclude = [".worktrees"]
